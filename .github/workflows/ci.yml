name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  matrix:
    name: Matrix
    runs-on: ubuntu-24.04
    outputs:
      supported: ${{ steps.matrix.outputs.supported }}
      hmr: ${{ steps.matrix.outputs.hmr }}
    steps:
      - uses: actions/checkout@v4

      - id: matrix
        run: |
          echo "supported=$(node ./scripts/github-matrix.mjs ci-supported)" >> "$GITHUB_OUTPUT"
          echo "hmr=$(node ./scripts/github-matrix.mjs ci-hmr)" >> "$GITHUB_OUTPUT"

  supported:
    name: ${{ matrix.platform }} / node ${{ matrix.node }}
    needs: matrix
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.matrix.outputs.supported) }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          architecture: ${{ matrix.nodearch }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      # pnpm's default script shell on Windows runners cannot run the POSIX-style
      # inline env assignments in package.json scripts; Git Bash can.
      - name: Use bash for pnpm scripts (Windows)
        if: runner.os == 'Windows'
        run: pnpm config set script-shell "C:\Program Files\Git\bin\bash.exe"

      - name: Install
        if: runner.os != 'Windows'
        run: pnpm install --frozen-lockfile

      - name: Install dependencies without package install scripts
        if: runner.os == 'Windows'
        run: pnpm install --ignore-scripts --frozen-lockfile

      - name: Build TypeScript entrypoints
        run: pnpm build:ts

      - name: Probe Windows install/runtime path
        if: runner.os == 'Windows'
        run: pnpm --dir packages/entry exec node ./scripts/install.js
        env:
          NARB_TRACE: 1

      - name: Typecheck
        run: pnpm typecheck

      - name: Test install script helpers
        run: node ./test/install-script.test.js

      - name: Test getter decoder
        # The decoder walks a byte buffer and is host-architecture independent,
        # so the POSIX runners cover every platform's getter shape. Skipped on
        # Windows, where the standalone `c++` used to build it is not on PATH.
        if: runner.os != 'Windows'
        run: pnpm test:decoder

      - name: Test local N-API build
        run: pnpm test

      - name: Test require parity with genuine internals
        run: pnpm test:parity

      - name: Test current-platform optional package
        if: matrix.optional
        run: pnpm test:optional

      - name: Prepare Node.js public headers
        if: matrix.optional
        run: pnpm -s headers -- --github-env

      - name: Test current-platform optional package (nodeabi)
        if: matrix.optional
        run: pnpm test:optional:nodeabi

      - name: Upload current-platform prebuilds
        if: matrix.optional
        uses: actions/upload-artifact@v4
        with:
          name: prebuild-${{ matrix.platform }}-node-${{ matrix.node }}
          path: packages/${{ matrix.platform }}/prebuilt/*.node
          if-no-files-found: error
          retention-days: 7

  hmr-comparison:
    name: ${{ matrix.platform }} / node ${{ matrix.node }} / hmr prebuild
    needs:
      - matrix
      - supported
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.matrix.outputs.hmr) }}
    env:
      NARB_DISABLE_LOCAL_BUILD: 1
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          architecture: ${{ matrix.nodearch }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies without package install scripts
        run: pnpm install --ignore-scripts --frozen-lockfile

      - name: Build TypeScript entrypoints
        run: pnpm build:ts

      - name: Download current-platform prebuilds
        uses: actions/download-artifact@v4
        with:
          name: prebuild-${{ matrix.platform }}-node-${{ matrix.node }}
          path: packages/${{ matrix.platform }}/prebuilt

      - name: Build HMR comparison
        run: pnpm exec tsc -p hmr-comparison/tsconfig.json

      - name: Run HMR comparison (N-API prebuild)
        run: node hmr-comparison/dist/runner/index.mjs
        env:
          NARB_BACKEND: napi

      - name: Run HMR comparison (nodeabi prebuild)
        run: node hmr-comparison/dist/runner/index.mjs
        env:
          NARB_BACKEND: nodeabi
