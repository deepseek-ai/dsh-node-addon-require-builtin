name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  matrix:
    name: Matrix
    runs-on: ubuntu-24.04
    outputs:
      platforms: ${{ steps.matrix.outputs.platforms }}
      hmr_platforms: ${{ steps.matrix.outputs.hmr_platforms }}
    steps:
      - uses: actions/checkout@v4

      - id: matrix
        run: |
          echo "platforms=$(node ./scripts/github-matrix.mjs ci-platforms)" >> "$GITHUB_OUTPUT"
          echo "hmr_platforms=$(node ./scripts/github-matrix.mjs ci-hmr-platforms)" >> "$GITHUB_OUTPUT"

  supported:
    name: 'NAPI Build: ${{ matrix.family }} / ${{ matrix.platform }}'
    needs: matrix
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.matrix.outputs.platforms) }}
    env:
      # CI runs with probe tracing on across every step so a failing job's log
      # carries the full runtime-probe trace. Release must stay quiet, so its
      # workflow does not set this.
      NARB_TRACE: 1
      # Each matrix entry builds and tests exactly one product family.
      NARB_PRODUCT: ${{ matrix.family }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.build_node }}
          architecture: ${{ matrix.nodearch }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      # pnpm's default script shell on Windows runners cannot run the POSIX-style
      # inline env assignments in package.json scripts; Git Bash can.
      - name: Use bash for pnpm scripts (Windows)
        if: runner.os == 'Windows'
        run: pnpm config set script-shell "C:\Program Files\Git\bin\bash.exe"

      - name: Install dependencies without package install scripts
        run: pnpm install --ignore-scripts --frozen-lockfile

      - name: Build TypeScript entrypoints
        run: pnpm build:ts

      - name: Typecheck
        run: pnpm typecheck

      - name: Test getter decoder
        # The decoder walks a byte buffer and is host-architecture independent,
        # so the POSIX runners cover every platform's getter shape. Skipped on
        # Windows, where the standalone `c++` used to build it is not on PATH.
        if: runner.os != 'Windows'
        run: pnpm test:decoder

      - name: Build N-API prebuild
        if: runner.os != 'Linux'
        run: pnpm build:prebuild:napi

      - name: Build and test N-API prebuild on glibc 2.28
        if: runner.os == 'Linux'
        shell: bash
        run: |
          case "$RUNNER_ARCH" in
            X64) image=quay.io/pypa/manylinux_2_28_x86_64:latest ;;
            ARM64) image=quay.io/pypa/manylinux_2_28_aarch64:latest ;;
            *) echo "unsupported Linux runner architecture: $RUNNER_ARCH" >&2; exit 1 ;;
          esac

          node_root="$(dirname "$(dirname "$(command -v node)")")"
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --env HOME=/tmp \
            --env NARB_BACKEND=napi \
            --env NARB_BUILD_OUTPUT=prebuild \
            --env NARB_PRODUCT \
            --volume "$node_root:/opt/node:ro" \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace \
            "$image" \
            bash -ceu '
              export PATH=/opt/node/bin:$PATH
              printf "%s\n" \
                "#!/usr/bin/env bash" \
                "exec g++ \"\$@\" -ldl" \
                > /tmp/narb-cxx
              chmod +x /tmp/narb-cxx
              export CXX=/tmp/narb-cxx

              node --import tsx ./scripts/build.ts
              env -u LD_LIBRARY_PATH \
                NARB_EXPECTED_BACKEND=napi NARB_DISABLE_LOCAL_BUILD=1 \
                node ./test/backend.test.js
              env -u LD_LIBRARY_PATH NARB_DISABLE_LOCAL_BUILD=1 \
                node --expose-internals ./test/require-parity.test.js
            '

      - name: Verify Linux prebuild compatibility
        if: runner.os == 'Linux'
        shell: bash
        run: |
          file='${{ matrix.prebuilt_path }}/${{ matrix.filename }}'
          max_glibc="$({
            readelf --version-info "$file" \
              | sed -n 's/.*Name: GLIBC_\([0-9][0-9.]*\).*/\1/p'
          } | sort -Vu | tail -n 1)"
          if [ -z "$max_glibc" ]; then
            echo "no GLIBC version requirements found in $file" >&2
            exit 1
          fi
          if [ "$(printf '%s\n' 2.28 "$max_glibc" | sort -V | tail -n 1)" != 2.28 ]; then
            echo "glibc floor regressed: GLIBC_$max_glibc is newer than GLIBC_2.28" >&2
            exit 1
          fi

          max_glibcxx="$({
            readelf --version-info "$file" \
              | sed -n 's/.*Name: GLIBCXX_\([0-9][0-9.]*\).*/\1/p'
          } | sort -Vu | tail -n 1)"
          if [ -z "$max_glibcxx" ]; then
            echo "no GLIBCXX version requirements found in $file" >&2
            exit 1
          fi
          if [ "$(printf '%s\n' 3.4.25 "$max_glibcxx" | sort -V | tail -n 1)" != 3.4.25 ]; then
            echo "libstdc++ floor regressed: GLIBCXX_$max_glibcxx is newer than GLIBCXX_3.4.25" >&2
            exit 1
          fi

          dynamic="$(readelf --dynamic "$file")"
          grep -q 'Shared library: \[libdl.so.2\]' <<<"$dynamic" || {
            echo "Linux prebuild does not declare its libdl.so.2 dependency" >&2
            exit 1
          }
          if ! grep -q 'Shared library: \[libstdc++\.so\.6\]' <<<"$dynamic"; then
            echo "Linux prebuild does not declare its shared libstdc++ runtime" >&2
            exit 1
          fi

      - name: Test N-API prebuild on Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          architecture: ${{ matrix.nodearch }}

      - name: Test N-API prebuild on Node 20
        run: |
          node ./test/backend.test.js
          node --expose-internals ./test/require-parity.test.js
        env:
          NARB_BACKEND: napi
          NARB_EXPECTED_BACKEND: napi
          NARB_DISABLE_LOCAL_BUILD: 1

      - name: Test N-API prebuild on Node 21
        uses: actions/setup-node@v4
        with:
          node-version: 21
          architecture: ${{ matrix.nodearch }}

      - name: Test N-API prebuild on Node 21
        run: |
          node ./test/backend.test.js
          node --expose-internals ./test/require-parity.test.js
        env:
          NARB_BACKEND: napi
          NARB_EXPECTED_BACKEND: napi
          NARB_DISABLE_LOCAL_BUILD: 1

      - name: Test N-API prebuild on Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          architecture: ${{ matrix.nodearch }}

      - name: Test N-API prebuild on Node 22
        run: |
          node ./test/backend.test.js
          node --expose-internals ./test/require-parity.test.js
        env:
          NARB_BACKEND: napi
          NARB_EXPECTED_BACKEND: napi
          NARB_DISABLE_LOCAL_BUILD: 1

      - name: Test N-API prebuild on Node 23
        if: matrix.platform != 'win32-ia32-msvc'
        uses: actions/setup-node@v4
        with:
          node-version: 23
          architecture: ${{ matrix.nodearch }}

      - name: Test N-API prebuild on Node 23
        if: matrix.platform != 'win32-ia32-msvc'
        run: |
          node ./test/backend.test.js
          node --expose-internals ./test/require-parity.test.js
        env:
          NARB_BACKEND: napi
          NARB_EXPECTED_BACKEND: napi
          NARB_DISABLE_LOCAL_BUILD: 1

      - name: Test N-API prebuild on Node 24
        if: matrix.platform != 'win32-ia32-msvc'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          architecture: ${{ matrix.nodearch }}

      - name: Test N-API prebuild on Node 24
        if: matrix.platform != 'win32-ia32-msvc'
        run: |
          node ./test/backend.test.js
          node --expose-internals ./test/require-parity.test.js
        env:
          NARB_BACKEND: napi
          NARB_EXPECTED_BACKEND: napi
          NARB_DISABLE_LOCAL_BUILD: 1

      - name: Test N-API prebuild on Node 25
        if: matrix.platform != 'win32-ia32-msvc'
        uses: actions/setup-node@v4
        with:
          node-version: 25
          architecture: ${{ matrix.nodearch }}

      - name: Test N-API prebuild on Node 25
        if: matrix.platform != 'win32-ia32-msvc'
        run: |
          node ./test/backend.test.js
          node --expose-internals ./test/require-parity.test.js
        env:
          NARB_BACKEND: napi
          NARB_EXPECTED_BACKEND: napi
          NARB_DISABLE_LOCAL_BUILD: 1

      - name: Test N-API prebuild on Node 26
        if: matrix.platform != 'win32-ia32-msvc'
        uses: actions/setup-node@v4
        with:
          node-version: 26
          architecture: ${{ matrix.nodearch }}

      - name: Test N-API prebuild on Node 26
        if: matrix.platform != 'win32-ia32-msvc'
        run: |
          node ./test/backend.test.js
          node --expose-internals ./test/require-parity.test.js
        env:
          NARB_BACKEND: napi
          NARB_EXPECTED_BACKEND: napi
          NARB_DISABLE_LOCAL_BUILD: 1

      - name: Test N-API prebuild on Node 27 nightly
        if: matrix.platform != 'win32-ia32-msvc'
        uses: actions/setup-node@v4
        with:
          node-version: 27-nightly
          architecture: ${{ matrix.nodearch }}

      - name: Test N-API prebuild on Node 27 nightly
        if: matrix.platform != 'win32-ia32-msvc'
        run: |
          node ./test/backend.test.js
          node --expose-internals ./test/require-parity.test.js
        env:
          NARB_BACKEND: napi
          NARB_EXPECTED_BACKEND: napi
          NARB_DISABLE_LOCAL_BUILD: 1

      # Keep the nodeabi check on the same latest stable runtime as before the
      # nightly test. Windows x86 remains on Node 22 because later releases do
      # not publish x86 binaries.
      - name: Restore Node 26 for nodeabi source build
        if: matrix.platform != 'win32-ia32-msvc'
        uses: actions/setup-node@v4
        with:
          node-version: 26
          architecture: ${{ matrix.nodearch }}

      - name: Prepare Node.js public headers
        run: pnpm -s headers -- --github-env

      - name: Test nodeabi source build
        run: pnpm test:nodeabi

      - name: Upload N-API prebuild
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.prebuilt_path }}/${{ matrix.filename }}
          if-no-files-found: error
          retention-days: 7

  hmr-comparison:
    name: 'HMR Test: ${{ matrix.family }} / ${{ matrix.platform }}'
    needs:
      - matrix
      - supported
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.matrix.outputs.hmr_platforms) }}
    env:
      NARB_BACKEND: napi
      NARB_PRODUCT: ${{ matrix.family }}
      NARB_DISABLE_LOCAL_BUILD: 1
      NARB_TRACE: 1
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.build_node }}
          architecture: ${{ matrix.nodearch }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies without package install scripts
        run: pnpm install --ignore-scripts --frozen-lockfile

      - name: Build TypeScript entrypoints
        run: pnpm build:ts

      - name: Download N-API prebuild
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.prebuilt_path }}

      - name: Build HMR comparison
        run: pnpm exec tsc -p hmr-comparison/tsconfig.json

      - name: Run HMR comparison
        run: node hmr-comparison/dist/runner/index.mjs
