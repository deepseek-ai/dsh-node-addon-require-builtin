name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  matrix:
    name: Matrix
    runs-on: ubuntu-24.04
    outputs:
      platforms: ${{ steps.matrix.outputs.platforms }}
      hmr_platforms: ${{ steps.matrix.outputs.hmr_platforms }}
      distro_platforms: ${{ steps.matrix.outputs.distro_platforms }}
    steps:
      - uses: actions/checkout@v4

      - id: matrix
        run: |
          echo "platforms=$(node ./scripts/github-matrix.mjs ci-platforms)" >> "$GITHUB_OUTPUT"
          echo "hmr_platforms=$(node ./scripts/github-matrix.mjs ci-hmr-platforms)" >> "$GITHUB_OUTPUT"
          echo "distro_platforms=$(node ./scripts/github-matrix.mjs ci-distro-platforms)" >> "$GITHUB_OUTPUT"

  supported:
    name: 'NAPI Build: ${{ matrix.platform }}'
    needs: matrix
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.matrix.outputs.platforms) }}
    env:
      # CI runs with probe tracing on across every step so a failing job's log
      # carries the full runtime-probe trace. Release must stay quiet, so its
      # workflow does not set this.
      NARB_TRACE: 1
      # Every product family is built and tested on this one runner, so steps
      # iterate this list instead of the job being fanned out per family. Each
      # step sets NARB_PRODUCT per iteration.
      FAMILIES: ${{ matrix.families }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.build_node }}
          architecture: ${{ matrix.nodearch }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      # pnpm's default script shell on Windows runners cannot run the POSIX-style
      # inline env assignments in package.json scripts; Git Bash can.
      - name: Use bash for pnpm scripts (Windows)
        if: runner.os == 'Windows'
        run: pnpm config set script-shell "C:\Program Files\Git\bin\bash.exe"

      - name: Install dependencies without package install scripts
        run: pnpm install --ignore-scripts --frozen-lockfile

      - name: Build TypeScript entrypoints
        run: pnpm build:ts

      - name: Typecheck
        run: pnpm typecheck

      - name: Test getter decoder
        # The decoder walks a byte buffer and is host-architecture independent,
        # so the POSIX runners cover every platform's getter shape. Skipped on
        # Windows, where the standalone `c++` used to build it is not on PATH.
        if: runner.os != 'Windows'
        run: pnpm test:decoder

      - name: Build N-API prebuild
        if: runner.os != 'Linux'
        shell: bash
        run: |
          for family in $FAMILIES; do
            echo "::group::build $family"
            NARB_PRODUCT="$family" pnpm build:prebuild:napi
            echo "::endgroup::"
          done
        env:
          npm_config_msvs_version: ${{ runner.os == 'Windows' && '2022' || '' }}

      - name: Build and test N-API prebuild on glibc 2.28
        if: runner.os == 'Linux'
        shell: bash
        run: |
          case "$RUNNER_ARCH" in
            X64) image=quay.io/pypa/manylinux_2_28_x86_64:latest ;;
            ARM64) image=quay.io/pypa/manylinux_2_28_aarch64:latest ;;
            *) echo "unsupported Linux runner architecture: $RUNNER_ARCH" >&2; exit 1 ;;
          esac

          node_root="$(dirname "$(dirname "$(command -v node)")")"
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --env HOME=/tmp \
            --env NARB_BACKEND=napi \
            --env NARB_BUILD_OUTPUT=prebuild \
            --env FAMILIES \
            --volume "$node_root:/opt/node:ro" \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace \
            "$image" \
            bash -ceu '
              export PATH=/opt/node/bin:$PATH
              printf "%s\n" \
                "#!/usr/bin/env bash" \
                "exec g++ \"\$@\" -ldl" \
                > /tmp/narb-cxx
              chmod +x /tmp/narb-cxx
              export CXX=/tmp/narb-cxx

              for family in $FAMILIES; do
                echo "::group::build and test $family on glibc 2.28"
                export NARB_PRODUCT="$family"
                node --import tsx ./scripts/build.ts
                env -u LD_LIBRARY_PATH \
                  NARB_EXPECTED_BACKEND=napi NARB_DISABLE_LOCAL_BUILD=1 \
                  node ./test/backend.test.js
                env -u LD_LIBRARY_PATH NARB_DISABLE_LOCAL_BUILD=1 \
                  node --expose-internals ./test/require-parity.test.js
                echo "::endgroup::"
              done
            '

      - name: Verify Linux prebuild compatibility
        if: runner.os == 'Linux'
        shell: bash
        run: |
          for family in $FAMILIES; do
            file="packages/$family/${{ matrix.platform }}/prebuilt/${{ matrix.filename }}"
            echo "checking $file"
            max_glibc="$({
              readelf --version-info "$file" \
                | sed -n 's/.*Name: GLIBC_\([0-9][0-9.]*\).*/\1/p'
            } | sort -Vu | tail -n 1)"
            if [ -z "$max_glibc" ]; then
              echo "no GLIBC version requirements found in $file" >&2
              exit 1
            fi
            if [ "$(printf '%s\n' 2.28 "$max_glibc" | sort -V | tail -n 1)" != 2.28 ]; then
              echo "glibc floor regressed: GLIBC_$max_glibc is newer than GLIBC_2.28" >&2
              exit 1
            fi

            max_glibcxx="$({
              readelf --version-info "$file" \
                | sed -n 's/.*Name: GLIBCXX_\([0-9][0-9.]*\).*/\1/p'
            } | sort -Vu | tail -n 1)"
            if [ -z "$max_glibcxx" ]; then
              echo "no GLIBCXX version requirements found in $file" >&2
              exit 1
            fi
            if [ "$(printf '%s\n' 3.4.25 "$max_glibcxx" | sort -V | tail -n 1)" != 3.4.25 ]; then
              echo "libstdc++ floor regressed: GLIBCXX_$max_glibcxx is newer than GLIBCXX_3.4.25" >&2
              exit 1
            fi

            dynamic="$(readelf --dynamic "$file")"
            grep -q 'Shared library: \[libdl.so.2\]' <<<"$dynamic" || {
              echo "Linux prebuild does not declare its libdl.so.2 dependency" >&2
              exit 1
            }
            if ! grep -q 'Shared library: \[libstdc++\.so\.6\]' <<<"$dynamic"; then
              echo "Linux prebuild does not declare its shared libstdc++ runtime" >&2
              exit 1
            fi
          done

      - name: Verify Windows prebuild compatibility
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installation = & $vswhere -latest -products * -property installationPath
          if (-not $installation) {
            throw 'Visual Studio installation not found'
          }
          $pattern = Join-Path $installation 'VC\Tools\MSVC\*\bin\Host*\*\dumpbin.exe'
          $dumpbin = Get-ChildItem $pattern | Select-Object -First 1
          if (-not $dumpbin) {
            throw 'dumpbin.exe not found'
          }

          foreach ($family in $env:FAMILIES.Split(' ')) {
            $file = "packages/$family/${{ matrix.platform }}/prebuilt/${{ matrix.filename }}"
            Write-Host "checking $file"
            $dependencies = & $dumpbin.FullName /DEPENDENTS $file | Out-String
            Write-Host $dependencies
            $forbidden = [regex]::Matches(
              $dependencies,
              '(?im)^\s*((?:vcruntime|msvcp|ucrtbase|api-ms-win-crt)[^\s]*\.dll)\s*$'
            )
            if ($forbidden.Count -ne 0) {
              $names = $forbidden | ForEach-Object { $_.Groups[1].Value }
              throw "Windows prebuild has dynamic C/C++ runtime dependencies: $($names -join ', ')"
            }
          }

      - name: Test N-API prebuild on Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          architecture: ${{ matrix.nodearch }}

      - name: Test N-API prebuild on Node 20
        shell: bash
        run: |
          for family in $FAMILIES; do
            echo "::group::$family"
            NARB_PRODUCT="$family" node ./test/backend.test.js
            NARB_PRODUCT="$family" node --expose-internals ./test/require-parity.test.js
            echo "::endgroup::"
          done
        env:
          NARB_BACKEND: napi
          NARB_EXPECTED_BACKEND: napi
          NARB_DISABLE_LOCAL_BUILD: 1

      - name: Test N-API prebuild on Node 21
        uses: actions/setup-node@v4
        with:
          node-version: 21
          architecture: ${{ matrix.nodearch }}

      - name: Test N-API prebuild on Node 21
        shell: bash
        run: |
          for family in $FAMILIES; do
            echo "::group::$family"
            NARB_PRODUCT="$family" node ./test/backend.test.js
            NARB_PRODUCT="$family" node --expose-internals ./test/require-parity.test.js
            echo "::endgroup::"
          done
        env:
          NARB_BACKEND: napi
          NARB_EXPECTED_BACKEND: napi
          NARB_DISABLE_LOCAL_BUILD: 1

      - name: Test N-API prebuild on Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          architecture: ${{ matrix.nodearch }}

      - name: Test N-API prebuild on Node 22
        shell: bash
        run: |
          for family in $FAMILIES; do
            echo "::group::$family"
            NARB_PRODUCT="$family" node ./test/backend.test.js
            NARB_PRODUCT="$family" node --expose-internals ./test/require-parity.test.js
            echo "::endgroup::"
          done
        env:
          NARB_BACKEND: napi
          NARB_EXPECTED_BACKEND: napi
          NARB_DISABLE_LOCAL_BUILD: 1

      - name: Test N-API prebuild on Node 23
        if: matrix.platform != 'win32-ia32-msvc'
        uses: actions/setup-node@v4
        with:
          node-version: 23
          architecture: ${{ matrix.nodearch }}

      - name: Test N-API prebuild on Node 23
        if: matrix.platform != 'win32-ia32-msvc'
        shell: bash
        run: |
          for family in $FAMILIES; do
            echo "::group::$family"
            NARB_PRODUCT="$family" node ./test/backend.test.js
            NARB_PRODUCT="$family" node --expose-internals ./test/require-parity.test.js
            echo "::endgroup::"
          done
        env:
          NARB_BACKEND: napi
          NARB_EXPECTED_BACKEND: napi
          NARB_DISABLE_LOCAL_BUILD: 1

      - name: Test N-API prebuild on Node 24
        if: matrix.platform != 'win32-ia32-msvc'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          architecture: ${{ matrix.nodearch }}

      - name: Test N-API prebuild on Node 24
        if: matrix.platform != 'win32-ia32-msvc'
        shell: bash
        run: |
          for family in $FAMILIES; do
            echo "::group::$family"
            NARB_PRODUCT="$family" node ./test/backend.test.js
            NARB_PRODUCT="$family" node --expose-internals ./test/require-parity.test.js
            echo "::endgroup::"
          done
        env:
          NARB_BACKEND: napi
          NARB_EXPECTED_BACKEND: napi
          NARB_DISABLE_LOCAL_BUILD: 1

      - name: Test N-API prebuild on Node 25
        if: matrix.platform != 'win32-ia32-msvc'
        uses: actions/setup-node@v4
        with:
          node-version: 25
          architecture: ${{ matrix.nodearch }}

      - name: Test N-API prebuild on Node 25
        if: matrix.platform != 'win32-ia32-msvc'
        shell: bash
        run: |
          for family in $FAMILIES; do
            echo "::group::$family"
            NARB_PRODUCT="$family" node ./test/backend.test.js
            NARB_PRODUCT="$family" node --expose-internals ./test/require-parity.test.js
            echo "::endgroup::"
          done
        env:
          NARB_BACKEND: napi
          NARB_EXPECTED_BACKEND: napi
          NARB_DISABLE_LOCAL_BUILD: 1

      - name: Test N-API prebuild on Node 26
        if: matrix.platform != 'win32-ia32-msvc'
        uses: actions/setup-node@v4
        with:
          node-version: 26
          architecture: ${{ matrix.nodearch }}

      - name: Test N-API prebuild on Node 26
        if: matrix.platform != 'win32-ia32-msvc'
        shell: bash
        run: |
          for family in $FAMILIES; do
            echo "::group::$family"
            NARB_PRODUCT="$family" node ./test/backend.test.js
            NARB_PRODUCT="$family" node --expose-internals ./test/require-parity.test.js
            echo "::endgroup::"
          done
        env:
          NARB_BACKEND: napi
          NARB_EXPECTED_BACKEND: napi
          NARB_DISABLE_LOCAL_BUILD: 1

      - name: Test N-API prebuild on Node 27 nightly
        if: matrix.platform != 'win32-ia32-msvc'
        uses: actions/setup-node@v4
        with:
          node-version: 27-nightly
          architecture: ${{ matrix.nodearch }}

      - name: Test N-API prebuild on Node 27 nightly
        if: matrix.platform != 'win32-ia32-msvc'
        shell: bash
        run: |
          for family in $FAMILIES; do
            echo "::group::$family"
            NARB_PRODUCT="$family" node ./test/backend.test.js
            NARB_PRODUCT="$family" node --expose-internals ./test/require-parity.test.js
            echo "::endgroup::"
          done
        env:
          NARB_BACKEND: napi
          NARB_EXPECTED_BACKEND: napi
          NARB_DISABLE_LOCAL_BUILD: 1

      # Keep the nodeabi check on the same latest stable runtime as before the
      # nightly test. Windows x86 remains on Node 22 because later releases do
      # not publish x86 binaries.
      - name: Restore Node 26 for nodeabi source build
        if: matrix.platform != 'win32-ia32-msvc'
        uses: actions/setup-node@v4
        with:
          node-version: 26
          architecture: ${{ matrix.nodearch }}

      - name: Prepare Node.js public headers
        run: pnpm -s headers -- --github-env

      - name: Test nodeabi source build
        shell: bash
        run: |
          for family in $FAMILIES; do
            echo "::group::$family nodeabi"
            NARB_PRODUCT="$family" pnpm test:nodeabi
            echo "::endgroup::"
          done

      # One step per family: upload-artifact takes a single name, and downstream
      # jobs resolve these artifacts by name. Indices match the matrix uploads
      # list, so adding a family means adding a step here.
      - name: Upload N-API prebuild (${{ matrix.uploads[0].family }})
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.uploads[0].artifact }}
          path: ${{ matrix.uploads[0].path }}
          if-no-files-found: error
          retention-days: 7

      - name: Upload N-API prebuild (${{ matrix.uploads[1].family }})
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.uploads[1].artifact }}
          path: ${{ matrix.uploads[1].path }}
          if-no-files-found: error
          retention-days: 7

  distro-node:
    name: 'Distro Node: ${{ matrix.platform }} / ${{ matrix.distro }}'
    needs:
      - matrix
      - supported
    runs-on: ${{ matrix.runner }}
    # rawhide is a rolling target, so its churn warns instead of failing the PR.
    continue-on-error: ${{ matrix.distro_optional }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.matrix.outputs.distro_platforms) }}
    env:
      NARB_TRACE: 1
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.build_node }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies without package install scripts
        run: pnpm install --ignore-scripts --frozen-lockfile

      - name: Build TypeScript entrypoints
        run: pnpm build:ts

      - name: Download N-API prebuilds for every family
        uses: actions/download-artifact@v4
        with:
          pattern: ${{ matrix.artifact_pattern }}
          path: /tmp/prebuilds

      - name: Place prebuilds and show what was downloaded
        shell: bash
        run: |
          for family in ${{ matrix.families }}; do
            src="/tmp/prebuilds/prebuild-$family-${{ matrix.platform }}-napi-v9"
            dst="packages/$family/${{ matrix.platform }}/prebuilt"
            mkdir -p "$dst"
            cp "$src"/* "$dst/"
            ls -l "$dst"
          done

      # A distribution's Node is a different binary, not just a different version:
      # usually a thin /usr/bin/node against a shared libnode.so, built with
      # hardening flags the nodejs.org binaries do not use. Measured so far: Fedora
      # combines `-mbranch-protection=standard` with `-mno-omit-leaf-frame-pointer`,
      # which gives even the private getter the probe decodes both pointer
      # authentication and a frame record (28 bytes); Debian enables branch
      # protection but without +leaf, so its getter stays `bti c; ldr; ret`
      # (12 bytes). The shape follows each distribution's own flags, so the decoder
      # is exercised against real packaged binaries.
      #
      # Install command, binary path and version query come from the matrix because
      # package managers and layouts differ. One container per Node stream, since
      # only Fedora installs streams in parallel; both families are tested inside
      # it, and a failing combination does not stop the others so one run reports
      # everything.
      #
      # Image tags pin a maintained release but float within it on purpose: a
      # rebuild that changes compiler flags is exactly the regression this job
      # exists to catch, so exact package versions are logged rather than pinned.
      - name: Test prebuilds against ${{ matrix.distro }}
        shell: bash
        run: |
          case "$RUNNER_ARCH" in
            X64) expect_arch=x86_64 ;;
            ARM64) expect_arch=aarch64 ;;
            *) echo "unsupported Linux runner architecture: $RUNNER_ARCH" >&2; exit 1 ;;
          esac

          status=0
          for stream in ${{ matrix.distro_streams }}; do
            echo "::group::${{ matrix.distro }} / node stream $stream"
            docker run --rm \
              --env NARB_BACKEND=napi \
              --env NARB_EXPECTED_BACKEND=napi \
              --env NARB_DISABLE_LOCAL_BUILD=1 \
              --env NARB_TRACE \
              --env "EXPECT_ARCH=$expect_arch" \
              --env "V=$stream" \
              --env "FAMILIES=${{ matrix.families }}" \
              --env 'INSTALL=${{ matrix.distro_install }}' \
              --env 'BINARY=${{ matrix.distro_binary }}' \
              --env 'PROBE=${{ matrix.distro_probe }}' \
              --volume "$GITHUB_WORKSPACE:/workspace" \
              --workdir /workspace \
              "${{ matrix.distro_image }}" \
              bash -ceu '
                test "$(uname -m)" = "$EXPECT_ARCH"

                # These are templates from scripts/github-matrix.mjs, not external
                # input; eval is what expands $V inside them.
                eval "$INSTALL" >/dev/null
                eval "$PROBE" || true

                node_bin=$(eval echo "$BINARY")
                "$node_bin" -v

                # Record the branch-protection census of this libnode. Which
                # distributions harden their builds is a measured property of
                # their flags, so it is logged rather than assumed.
                lib=$(ldd "$node_bin" | awk "/libnode\.so/ {print \$3; exit}")
                echo "libnode: ${lib:-none (statically linked)}"
                if [ -n "$lib" ] && command -v objdump >/dev/null 2>&1; then
                  objdump -d "$lib" > /tmp/dis.txt 2>/dev/null || true
                  printf "hardening: paciasp=%s bti_c=%s endbr64=%s retaa=%s\n" \
                    "$(grep -c "\bpaciasp\b" /tmp/dis.txt || true)" \
                    "$(grep -c "\bbti\s*c\b" /tmp/dis.txt || true)" \
                    "$(grep -c "\bendbr64\b" /tmp/dis.txt || true)" \
                    "$(grep -c "\breta[ab]\b" /tmp/dis.txt || true)"
                fi

                # NARB_TRACE is on, so a decode failure prints the probe trace and
                # both decode stages reasons, and a binding-resolution failure
                # prints every attempted path.
                rc=0
                for family in $FAMILIES; do
                  echo "--- $family ---"
                  export NARB_PRODUCT="$family"
                  "$node_bin" ./test/backend.test.js || rc=1
                  "$node_bin" --expose-internals ./test/require-parity.test.js || rc=1
                done
                exit $rc
              ' || status=1
            echo "::endgroup::"
          done
          exit $status

  hmr-comparison:
    name: 'HMR Test: ${{ matrix.family }} / ${{ matrix.platform }}'
    needs:
      - matrix
      - supported
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.matrix.outputs.hmr_platforms) }}
    env:
      NARB_BACKEND: napi
      NARB_PRODUCT: ${{ matrix.family }}
      NARB_DISABLE_LOCAL_BUILD: 1
      NARB_TRACE: 1
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.build_node }}
          architecture: ${{ matrix.nodearch }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies without package install scripts
        run: pnpm install --ignore-scripts --frozen-lockfile

      - name: Build TypeScript entrypoints
        run: pnpm build:ts

      - name: Download N-API prebuild
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.prebuilt_path }}

      - name: Build HMR comparison
        run: pnpm exec tsc -p hmr-comparison/tsconfig.json

      - name: Run HMR comparison
        run: node hmr-comparison/dist/runner/index.mjs
